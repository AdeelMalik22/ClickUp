{% extends 'app_layout.html' %}

{% block header_left %}
<div class="flex items-center gap-3">
    <a href="/workspaces/" class="text-textMuted hover:text-textMain transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18">
            </path>
        </svg>
    </a>
    <div id="ws-initial"
        class="w-8 h-8 rounded bg-primary text-white flex items-center justify-center font-bold text-sm shadow-sm hidden">
        W</div>
    <h1 id="ws-title" class="text-xl font-bold text-textMain tracking-tight">Workspace Settings</h1>
</div>
{% endblock %}

{% block content %}
<div class="px-8 py-6 max-w-4xl mx-auto">
    <!-- Tabs -->
    <div class="flex border-b border-borderSubtle mb-8">
        <button class="px-4 py-3 border-b-2 border-primary font-semibold text-primary text-sm">General Settings</button>
        <button id="btn-members-tab"
            class="px-4 py-3 border-b-2 border-transparent font-medium text-textMuted hover:text-textMain hover:border-borderSubtle text-sm transition-colors">Members</button>
    </div>

    <!-- General Settings Form -->
    <div class="bg-white rounded-xl shadow-sm border border-borderSubtle p-6 max-w-2xl">
        <h3 class="text-lg font-bold text-textMain mb-4">Workspace Profile</h3>
        <form id="form-edit-ws" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-textMain mb-1.5">Workspace Name</label>
                <input type="text" id="ws-name-input" required
                    class="w-full px-4 py-2 bg-surfaceHover border border-borderSubtle rounded-lg focus:bg-white focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none text-sm transition-all">
            </div>
            <div>
                <label class="block text-sm font-semibold text-textMain mb-1.5">Description</label>
                <textarea id="ws-desc-input" rows="4"
                    class="w-full px-4 py-2 bg-surfaceHover border border-borderSubtle rounded-lg resize-none outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary text-sm transition-all"></textarea>
            </div>

            <div class="pt-4 border-t border-borderSubtle flex justify-between items-center">
                <button type="button" onclick="deleteWorkspace()"
                    class="text-sm font-medium text-red-500 hover:text-red-600 transition-colors">Delete
                    Workspace</button>
                <button type="submit" id="btn-save-ws"
                    class="bg-primary hover:bg-primaryHover text-white px-5 py-2 rounded-lg text-sm font-medium transition-colors shadow-sm">Save
                    Changes</button>
            </div>
        </form>
    </div>
</div>

<script>
    const wsId = window.location.pathname.split('/').filter(Boolean).pop();

    document.getElementById('btn-members-tab').onclick = () => {
        window.location.href = `/workspaces/${wsId}/members/`;
    };

    async function loadWorkspaceDetails() {
        try {
            const res = await fetchWithAuth(`/workspaces/${wsId}/`);
            if (res.ok) {
                const ws = await res.json();
                document.getElementById('ws-name-input').value = ws.name;
                document.getElementById('ws-desc-input').value = ws.description || '';

                document.getElementById('ws-initial').innerText = ws.name.charAt(0).toUpperCase();
                document.getElementById('ws-initial').classList.remove('hidden');
                document.getElementById('ws-title').innerText = ws.name + ' Settings';
            }
        } catch (e) {
            showToast('Failed to load workspace', 'error');
        }
    }

    document.getElementById('form-edit-ws').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn-save-ws');
        btn.disabled = true;
        btn.innerHTML = 'Saving...';

        try {
            const res = await fetchWithAuth(`/workspaces/${wsId}/`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: document.getElementById('ws-name-input').value,
                    description: document.getElementById('ws-desc-input').value
                })
            });
            if (res.ok) {
                showToast('Workspace updated successfully');
                loadWorkspaceDetails();
                if (window.loadWorkspaceSidebarData) loadWorkspaceSidebarData(); // update sidebar
            }
        } catch (e) { } finally {
            btn.disabled = false;
            btn.innerHTML = 'Save Changes';
        }
    });

    async function deleteWorkspace() {
        if (!confirm('Are you sure you want to delete this workspace? This cannot be undone.')) return;
        try {
            const res = await fetchWithAuth(`/workspaces/${wsId}/`, { method: 'DELETE' });
            if (res.status === 204) {
                window.location.href = '/workspaces/';
            } else {
                const data = await res.json();
                showToast(data.detail || 'Failed to delete', 'error');
            }
        } catch (e) { }
    }

    document.addEventListener('DOMContentLoaded', loadWorkspaceDetails);
</script>
{% endblock %}
