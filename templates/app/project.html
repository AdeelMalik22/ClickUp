{% extends 'app_layout.html' %}

{% block title %}Project - ClickUp Clone{% endblock %}

{% block header_left %}
<div class="flex flex-col">
    <div class="flex items-center gap-2 text-xs text-textMuted font-medium mb-0.5">
        <span id="breadcrumb-ws">Workspace</span>
        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
        <span class="text-primary">Projects</span>
    </div>
    <div class="flex items-center gap-2">
        <div class="w-4 h-4 rounded-full border-[3px] border-primary"></div>
        <h1 id="project-title" class="text-xl font-bold text-textMain tracking-tight">Loading Project...</h1>
    </div>
</div>
{% endblock %}

{% block content %}
<div class="flex flex-col h-full overflow-hidden relative">
    
    <!-- View Tabs -->
    <div class="border-b border-borderSubtle bg-white px-6 flex items-center gap-6 shrink-0 z-10 sticky top-0">
        <button id="tab-list" class="py-3 px-1 border-b-2 border-primary text-primary font-semibold text-sm transition-colors flex items-center gap-2" onclick="switchView('list')">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
            List
        </button>
        <button id="tab-board" class="py-3 px-1 border-b-2 border-transparent text-textMuted hover:text-textMain font-medium text-sm transition-colors flex items-center gap-2" onclick="switchView('board')">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2M9 7a2 2 0 012-2h2a2 2 0 012 2m0 10V7m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2"></path></svg>
            Board
        </button>
        <button id="tab-table" class="py-3 px-1 border-b-2 border-transparent text-textMuted hover:text-textMain font-medium text-sm transition-colors flex items-center gap-2" onclick="switchView('table')">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M3 14h18m-9-4v8m-7 0h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
            Table
        </button>
        <button id="tab-calendar" class="py-3 px-1 border-b-2 border-transparent text-textMuted hover:text-textMain font-medium text-sm transition-colors flex items-center gap-2" onclick="switchView('calendar')">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
            Calendar
        </button>
        
        <div class="ml-auto flex items-center gap-2 py-2">
            <button class="bg-primary/10 text-primary hover:bg-primary/20 font-medium px-3 py-1.5 rounded text-sm transition-colors" onclick="openCreateTaskModal(projectId)">
                + New Task
            </button>
        </div>
    </div>

    <!-- Scrollable Content Area -->
    <div class="flex-1 overflow-auto bg-surface p-6">
        
        <!-- List View -->
        <div id="view-list" class="w-full max-w-6xl mx-auto space-y-8 pb-10">
            <!-- Dynamic Groups (by status) will go here -->
        </div>

        <!-- Board View -->
        <div id="view-board" class="hidden h-full flex items-start gap-6 overflow-x-auto pb-4">
            <!-- Dynamic Kanban Columns will go here -->
        </div>

        <!-- Table View -->
        <div id="view-table" class="hidden w-full bg-white border border-borderSubtle rounded-lg overflow-hidden flex flex-col shadow-sm">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-textMain border-collapse">
                    <thead class="bg-surfaceHover text-xs text-textMuted uppercase border-b border-borderSubtle">
                        <tr>
                            <th class="px-4 py-3 font-medium border-r border-borderSubtle w-12 text-center">#</th>
                            <th class="px-4 py-3 font-medium border-r border-borderSubtle">Name</th>
                            <th class="px-4 py-3 font-medium border-r border-borderSubtle w-32">Assignee</th>
                            <th class="px-4 py-3 font-medium border-r border-borderSubtle w-36">Status</th>
                            <th class="px-4 py-3 font-medium border-r border-borderSubtle w-32">Due Date</th>
                            <th class="px-4 py-3 font-medium w-32">Priority</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-borderSubtle">
                        <!-- Tasks go here -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Calendar View -->
        <div id="view-calendar" class="hidden w-full h-full bg-white border border-borderSubtle rounded-lg flex flex-col shadow-sm">
            <!-- Calendar Header -->
            <div class="flex items-center justify-between p-4 border-b border-borderSubtle">
                <div class="flex items-center gap-4">
                    <h2 id="calendar-month-year" class="text-lg font-bold text-textMain">May 2026</h2>
                    <div class="flex items-center border border-borderSubtle rounded-md overflow-hidden">
                        <button onclick="changeCalendarMonth(-1)" class="px-2 py-1 bg-surface hover:bg-surfaceHover text-textMain transition-colors border-r border-borderSubtle">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        </button>
                        <button onclick="changeCalendarMonth(1)" class="px-2 py-1 bg-surface hover:bg-surfaceHover text-textMain transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                        </button>
                    </div>
                    <button onclick="resetCalendar()" class="px-3 py-1 text-sm font-medium text-textMain bg-surface border border-borderSubtle rounded-md hover:bg-surfaceHover transition-colors shadow-sm">Today</button>
                </div>
            </div>
            
            <!-- Calendar Grid -->
            <div class="flex-1 flex flex-col overflow-hidden bg-borderSubtle gap-[1px]">
                <!-- Days of week -->
                <div class="grid grid-cols-7 bg-surface">
                    <div class="py-2 text-center text-xs font-bold text-textMuted uppercase tracking-wider">Sun</div>
                    <div class="py-2 text-center text-xs font-bold text-textMuted uppercase tracking-wider">Mon</div>
                    <div class="py-2 text-center text-xs font-bold text-textMuted uppercase tracking-wider">Tue</div>
                    <div class="py-2 text-center text-xs font-bold text-textMuted uppercase tracking-wider">Wed</div>
                    <div class="py-2 text-center text-xs font-bold text-textMuted uppercase tracking-wider">Thu</div>
                    <div class="py-2 text-center text-xs font-bold text-textMuted uppercase tracking-wider">Fri</div>
                    <div class="py-2 text-center text-xs font-bold text-textMuted uppercase tracking-wider">Sat</div>
                </div>
                <!-- Days grid -->
                <div id="calendar-grid" class="flex-1 grid grid-cols-7 grid-rows-5 gap-[1px]">
                    <!-- Cells injected via JS -->
                </div>
            </div>
        </div>

    </div>
</div>

<!-- Task Detail Slide-over HTML Template (Injected dynamically) -->
<template id="task-detail-template">
    <div class="flex flex-col h-full">
        <div class="flex items-center justify-between p-4 border-b border-borderSubtle bg-white shrink-0">
            <div class="flex items-center gap-2">
                <select id="modal-status-select" class="text-xs font-bold uppercase tracking-wide px-2 py-1.5 rounded cursor-pointer outline-none appearance-none bg-surfaceHover border border-borderSubtle hover:bg-gray-100 transition-colors">
                    <option value="todo">To Do</option>
                    <option value="in_progress">In Progress</option>
                    <option value="review">Review</option>
                    <option value="completed">Completed</option>
                    <option value="on_hold">On Hold</option>
                    <option value="cancelled">Cancelled</option>
                </select>
            </div>
            <div class="flex items-center gap-2">
                <button class="text-textMuted hover:text-textMain p-1" onclick="closeTaskPanel()">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
        </div>
        
        <div class="flex-1 overflow-y-auto p-6 bg-white flex flex-col gap-8">
            <!-- Header -->
            <div>
                <h2 class="text-2xl font-bold text-textMain mb-4" id="modal-title">Task Title</h2>
                <div class="grid xl:grid-cols-2 gap-4 border border-borderSubtle rounded-xl p-4 bg-surfaceHover">
                    <div class="space-y-4">
                        <div>
                            <p class="text-xs text-textMuted font-medium mb-1 uppercase tracking-wide">Assignee</p>
                            <div class="flex items-center gap-2 mt-1">
                                <select id="modal-assignee-select" class="w-full text-sm px-2 py-1.5 rounded border border-borderSubtle bg-white focus:outline-none focus:ring-1 focus:ring-primary">
                                    <option value="">Unassigned</option>
                                </select>
                                <button type="button" id="btn-assign-task" class="px-3 py-1.5 rounded bg-primary hover:bg-primaryHover text-white text-sm font-medium transition-colors">Assign</button>
                            </div>
                            <p id="modal-assignee" class="mt-2 text-xs text-textMuted">Unassigned</p>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <p class="text-xs text-textMuted font-medium mb-1 uppercase tracking-wide">Start date</p>
                                <input id="modal-start-date" type="date" class="w-full px-3 py-2 rounded border border-borderSubtle bg-white text-sm focus:outline-none focus:ring-1 focus:ring-primary">
                            </div>
                            <div>
                                <p class="text-xs text-textMuted font-medium mb-1 uppercase tracking-wide">Due date</p>
                                <input id="modal-due-date" type="date" class="w-full px-3 py-2 rounded border border-borderSubtle bg-white text-sm focus:outline-none focus:ring-1 focus:ring-primary">
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <p class="text-xs text-textMuted font-medium mb-1 uppercase tracking-wide">Time estimate</p>
                                <input id="modal-time-estimate" type="number" min="0" step="1" placeholder="Minutes" class="w-full px-3 py-2 rounded border border-borderSubtle bg-white text-sm focus:outline-none focus:ring-1 focus:ring-primary">
                            </div>
                            <div>
                                <p class="text-xs text-textMuted font-medium mb-1 uppercase tracking-wide">Tags</p>
                                <input id="modal-tags-input" type="text" placeholder="marketing, frontend" class="w-full px-3 py-2 rounded border border-borderSubtle bg-white text-sm focus:outline-none focus:ring-1 focus:ring-primary">
                            </div>
                        </div>
                    </div>

                    <div class="space-y-4">
                        <div>
                            <p class="text-xs text-textMuted font-medium mb-1 uppercase tracking-wide">Priority</p>
                            <select id="modal-priority-select" class="text-xs font-bold uppercase tracking-wide px-2 py-1.5 rounded cursor-pointer outline-none appearance-none bg-surfaceHover border border-borderSubtle hover:bg-gray-100 transition-colors w-full sm:w-auto">
                                <option value="low">Low</option>
                                <option value="medium">Medium</option>
                                <option value="high">High</option>
                                <option value="urgent">Urgent</option>
                            </select>
                        </div>
                        <div class="rounded-lg border border-borderSubtle bg-white p-3 space-y-2">
                            <p class="text-xs font-semibold uppercase tracking-wide text-textMuted">Quick actions</p>
                            <button type="button" class="w-full text-left px-3 py-2 rounded hover:bg-surfaceHover text-sm" id="btn-add-subtask" onclick="handleAddSubtask()">+ Add subtask</button>
                            <button type="button" class="w-full text-left px-3 py-2 rounded hover:bg-surfaceHover text-sm" id="btn-create-checklist" onclick="handleCreateChecklist()">Create checklist</button>
                            <button type="button" class="w-full text-left px-3 py-2 rounded hover:bg-surfaceHover text-sm" id="btn-attach-file" onclick="handleAttachFile()">Attach file</button>
                            <button type="button" class="w-full text-left px-3 py-2 rounded hover:bg-surfaceHover text-sm" id="btn-dependencies" onclick="handleDependencies()">Relate items or add dependencies</button>
                        </div>
                        <div class="rounded-lg border border-borderSubtle bg-white p-3">
                            <p class="text-xs font-semibold uppercase tracking-wide text-textMuted mb-2">Track time</p>
                            <button type="button" class="px-3 py-1.5 rounded bg-surfaceHover hover:bg-gray-100 text-sm font-medium" id="btn-track-time" onclick="handleTrackTime()">Start</button>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Description -->
            <div>
                <div class="flex items-center justify-between mb-2">
                    <h3 class="text-sm font-bold text-textMain uppercase tracking-wide">Description</h3>
                    <button id="btn-save-task-details" type="button" class="px-3 py-1.5 rounded bg-primary hover:bg-primaryHover text-white text-sm font-medium transition-colors">Save details</button>
                </div>
                <textarea id="modal-description-input" rows="6" class="w-full text-sm text-textMain whitespace-pre-wrap p-4 border border-borderSubtle rounded-lg bg-white focus:outline-none focus:ring-1 focus:ring-primary resize-none" placeholder="Add description, or write with AI"></textarea>
            </div>
            
            <!-- Comments -->
            <div class="flex-1 flex flex-col">
                <h3 class="text-sm font-bold text-textMain mb-4 uppercase tracking-wide">Activity & Comments</h3>
                <div class="flex-1 overflow-y-auto space-y-4 mb-4" id="modal-comments">
                    <p class="text-sm text-textMuted italic">Loading comments...</p>
                </div>
                
                <div class="mt-auto border border-borderSubtle rounded-lg focus-within:ring-1 focus-within:ring-primary focus-within:border-primary transition-all p-2 bg-surfaceHover">
                    <textarea id="comment-input" rows="2" class="w-full bg-transparent outline-none text-sm p-2 resize-none" placeholder="Write a comment..."></textarea>
                    <div class="flex justify-end mt-2">
                        <button class="bg-primary hover:bg-primaryHover text-white px-3 py-1.5 rounded text-sm font-medium transition-colors" id="btn-post-comment">Comment</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</template>

<script>
    const projectId = "{{ view.kwargs.pk }}";
    let currentProject = null;
    let tasks = [];

    // Valid Statuses based on claude.md
    const STATUSES = {
        'todo': { label: 'To Do', color: 'bg-gray-200 text-gray-700', border: 'border-gray-300' },
        'in_progress': { label: 'In Progress', color: 'bg-blue-100 text-blue-700', border: 'border-blue-300' },
        'review': { label: 'Review', color: 'bg-yellow-100 text-yellow-700', border: 'border-yellow-300' },
        'completed': { label: 'Completed', color: 'bg-green-100 text-green-700', border: 'border-green-300' },
        'on_hold': { label: 'On Hold', color: 'bg-orange-100 text-orange-700', border: 'border-orange-300' },
        'cancelled': { label: 'Cancelled', color: 'bg-red-100 text-red-700', border: 'border-red-300' }
    };

    const PRIORITIES = {
        'urgent': { label: 'Urgent', badge: 'bg-red-100 text-red-700' },
        'high': { label: 'High', badge: 'bg-yellow-100 text-yellow-700' },
        'medium': { label: 'Medium', badge: 'bg-blue-100 text-blue-700' },
        'low': { label: 'Low', badge: 'bg-gray-100 text-gray-700' }
    };

    function getWorkspaceMembers() {
        return (window.currentWorkspace && Array.isArray(window.currentWorkspace.memberships))
            ? window.currentWorkspace.memberships
            : [];
    }

    function getMemberLabel(userId) {
        if (!userId) return 'Unassigned';
        const member = getWorkspaceMembers().find(m => String(m.user_id || m.user) === String(userId));
        if (!member) return 'Unassigned';
        return member.user_name || member.user_email || 'User';
    }

    function populateAssigneeSelect(selectedAssignee = '') {
        const select = document.getElementById('modal-assignee-select');
        if (!select) return;

        select.innerHTML = '<option value="">Unassigned</option>';
        getWorkspaceMembers().forEach(member => {
            const option = document.createElement('option');
            option.value = member.user_id || member.user;
            option.textContent = `${member.user_name || member.user_email || 'User'}${member.role ? ` (${member.role})` : ''}`;
            select.appendChild(option);
        });
        select.value = selectedAssignee || '';

        const label = document.getElementById('modal-assignee');
        if (label) {
            label.textContent = getMemberLabel(selectedAssignee);
        }
    }

    function getFirstErrorMessage(data, fallback) {
        if (!data || typeof data !== 'object') return fallback;
        const firstKey = Object.keys(data)[0];
        const value = data[firstKey];
        if (Array.isArray(value) && value.length > 0) return value[0];
        if (typeof value === 'string') return value;
        return fallback;
    }

    async function patchTask(taskId, payload, successMessage) {
        const res = await fetchWithAuth(`/tasks/${taskId}/`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        console.log('PATCH Response Status:', res.status);
        const responseData = await res.json().catch(() => ({}));
        console.log('PATCH Response Data:', responseData);

        if (res.ok) {
            if (successMessage) showToast(successMessage);
            fetchTasks();
            return true;
        }

        const errorMsg = getFirstErrorMessage(responseData, 'Failed to update task');
        console.error('PATCH Error:', errorMsg);
        showToast(errorMsg, 'error');
        return false;
    }

    async function fetchProjectData() {
        try {
            // Wait for sidebar to load workspace, or fetch project directly
            const res = await fetchWithAuth(`/projects/${projectId}/`);
            if (res.ok) {
                currentProject = await res.json();
                document.getElementById('project-title').innerText = currentProject.name;
                // Try to set workspace name if available via sidebar
                if(window.currentWorkspace) {
                    document.getElementById('breadcrumb-ws').innerText = window.currentWorkspace.name;
                }
                
                fetchTasks();
            } else {
                showToast('Failed to load project details.', 'error');
            }
        } catch(e) {
            console.error(e);
        }
    }

    async function fetchTasks() {
        try {
            const res = await fetchWithAuth(`/tasks/?project=${projectId}`);
            if (res.ok) {
                const data = await res.json();
                tasks = data.results || [];
                renderListView();
                renderBoardView();
                renderTableView();
                renderCalendarView();
            }
        } catch(e) {
            console.error(e);
        }
    }

    function renderListView() {
        const container = document.getElementById('view-list');
        container.innerHTML = '';
        
        // Group tasks by status
        Object.keys(STATUSES).forEach(statusKey => {
            const statusTasks = tasks.filter(t => t.status === statusKey);
            if (statusTasks.length === 0 && statusKey !== 'todo' && statusKey !== 'in_progress' && statusKey !== 'completed') return;
            
            const group = document.createElement('div');
            group.className = 'bg-white rounded-lg border border-borderSubtle overflow-hidden shadow-sm';
            
            const header = document.createElement('div');
            header.className = `px-4 py-2 border-b border-borderSubtle bg-surfaceHover flex items-center gap-3`;
            header.innerHTML = `
                <div class="px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wide ${STATUSES[statusKey].color}">${STATUSES[statusKey].label}</div>
                <span class="text-xs text-textMuted font-medium">${statusTasks.length} tasks</span>
            `;
            group.appendChild(header);
            
            if (statusTasks.length === 0) {
                group.innerHTML += `<div class="p-4 text-sm text-textMuted italic text-center border-b border-borderSubtle last:border-b-0">No tasks in this status</div>`;
            } else {
                statusTasks.forEach(task => {
                    const priority = PRIORITIES[task.priority] || {label: 'Normal', badge: 'bg-gray-100 text-gray-700'};
                    
                    const row = document.createElement('div');
                    row.className = 'flex items-center p-3 border-b border-borderSubtle last:border-b-0 hover:bg-surfaceHover transition-colors cursor-pointer group';
                    row.onclick = () => openTaskPanel(task.id);
                    
                    row.innerHTML = `
                        <div class="flex-1 flex items-center gap-3 min-w-0">
                            <div class="w-4 h-4 rounded border border-gray-300 group-hover:border-primary shrink-0 transition-colors"></div>
                            <span class="text-sm font-medium text-textMain truncate">${task.title}</span>
                        </div>
                        <div class="w-32 shrink-0 flex items-center">
                            <div class="w-6 h-6 rounded-full bg-blue-500 text-white flex items-center justify-center text-xs font-bold shadow-sm" title="${task.assignee || 'Unassigned'}">${task.assignee ? 'U' : '-'}</div>
                        </div>
                        <div class="w-24 shrink-0">
                            <span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wide ${priority.badge}">${priority.label}</span>
                        </div>
                        <div class="w-24 shrink-0 text-xs text-textMuted font-medium">
                            ${new Date(task.created_at).toLocaleDateString()}
                        </div>
                    `;
                    group.appendChild(row);
                });
            }
            
            container.appendChild(group);
        });
    }

    function renderBoardView() {
        const container = document.getElementById('view-board');
        container.innerHTML = '';
        
        // Render core columns
        ['todo', 'in_progress', 'review', 'completed'].forEach(statusKey => {
            const statusTasks = tasks.filter(t => t.status === statusKey);
            const statusDef = STATUSES[statusKey];
            
            const col = document.createElement('div');
            col.className = 'w-[300px] shrink-0 flex flex-col h-full';
            col.innerHTML = `
                <div class="flex items-center justify-between mb-3 px-1">
                    <div class="flex items-center gap-2">
                        <span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wide ${statusDef.color}">${statusDef.label}</span>
                        <span class="text-xs text-textMuted font-medium">${statusTasks.length}</span>
                    </div>
                    <button class="text-textMuted hover:text-textMain"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg></button>
                </div>
                <div class="flex-1 bg-surfaceHover rounded-lg p-2 overflow-y-auto space-y-2 border border-borderSubtle" id="board-col-${statusKey}" data-status="${statusKey}">
                    ${statusTasks.map(t => {
                        const prio = PRIORITIES[t.priority] || {label: 'Normal', badge: 'bg-gray-100 text-gray-700'};
                        return `
                            <div class="bg-white p-3 rounded shadow-sm border border-borderSubtle cursor-grab hover:shadow-md transition-shadow" data-id="${t.id}" onclick="openTaskPanel(${t.id})">
                                <div class="flex justify-between items-start mb-2">
                                    <span class="px-1.5 py-0.5 rounded text-[9px] font-bold uppercase tracking-wide ${prio.badge}">${prio.label}</span>
                                </div>
                                <h4 class="text-sm font-medium text-textMain line-clamp-2 mb-3">${t.title}</h4>
                                <div class="flex justify-between items-center">
                                    <span class="text-[10px] text-textMuted font-medium">#${t.id}</span>
                                    <div class="w-5 h-5 rounded-full bg-blue-500 text-white flex items-center justify-center text-[10px] font-bold shadow-sm">U</div>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
            container.appendChild(col);
        });

        // Initialize SortableJS
        if (typeof Sortable !== 'undefined') {
            ['todo', 'in_progress', 'review', 'completed'].forEach(statusKey => {
                const el = document.getElementById(`board-col-${statusKey}`);
                if(el) {
                    new Sortable(el, {
                        group: 'kanban',
                        animation: 150,
                        ghostClass: 'opacity-50',
                        onEnd: async function (evt) {
                            const itemEl = evt.item;  // dragged HTMLElement
                            const toEl = evt.to;      // target list
                            const fromEl = evt.from;
                            
                            if (toEl !== fromEl) {
                                const newStatus = toEl.getAttribute('data-status');
                                const taskId = itemEl.getAttribute('data-id');
                                
                                // Call API to update status
                                try {
                                    const res = await fetchWithAuth(`/tasks/update_status/${taskId}/`, {
                                        method: 'PATCH',
                                        headers: { 'Content-Type': 'application/json' },
                                        body: JSON.stringify({ status: newStatus })
                                    });
                                    if(res.ok) {
                                        showToast(`Task status updated to ${STATUSES[newStatus].label}`);
                                        // Refetch to ensure sync
                                        fetchTasks();
                                    } else {
                                        showToast('Failed to update status', 'error');
                                        fetchTasks(); // revert DOM
                                    }
                                } catch(e) {
                                    showToast('Network error updating status', 'error');
                                    fetchTasks(); // revert DOM
                                }
                            }
                        },
                    });
                }
            });
        }
    }

    function renderTableView() {
        const tbody = document.getElementById('table-body');
        if(!tbody) return;
        tbody.innerHTML = '';
        
        if (tasks.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="px-4 py-8 text-center text-textMuted italic">No tasks found</td></tr>`;
            return;
        }
        
        tasks.forEach((task, index) => {
            const statusDef = STATUSES[task.status] || {label: 'Unknown', color: 'bg-gray-100 text-gray-700'};
            const prio = PRIORITIES[task.priority] || {label: 'Normal', badge: 'bg-gray-100 text-gray-700'};
            
            const tr = document.createElement('tr');
            tr.className = 'hover:bg-surfaceHover transition-colors cursor-pointer group';
            tr.onclick = () => openTaskPanel(task.id);
            
            tr.innerHTML = `
                <td class="px-4 py-3 border-r border-borderSubtle text-textMuted text-xs text-center">${index + 1}</td>
                <td class="px-4 py-3 border-r border-borderSubtle font-medium group-hover:text-primary transition-colors">${task.title}</td>
                <td class="px-4 py-3 border-r border-borderSubtle">
                    <div class="flex items-center gap-2">
                        <div class="w-6 h-6 rounded-full bg-blue-500 text-white flex items-center justify-center text-[10px] font-bold shadow-sm">U</div>
                    </div>
                </td>
                <td class="px-4 py-3 border-r border-borderSubtle">
                    <span class="px-2 py-1 rounded text-[10px] font-bold uppercase tracking-wide ${statusDef.color}">${statusDef.label}</span>
                </td>
                <td class="px-4 py-3 border-r border-borderSubtle text-xs text-textMuted">
                    ${new Date(task.created_at).toLocaleDateString()}
                </td>
                <td class="px-4 py-3">
                    <span class="px-2 py-1 rounded text-[10px] font-bold uppercase tracking-wide ${prio.badge}">${prio.label}</span>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    let currentCalendarDate = new Date();
    
    function changeCalendarMonth(offset) {
        currentCalendarDate.setMonth(currentCalendarDate.getMonth() + offset);
        renderCalendarView();
    }
    
    function resetCalendar() {
        currentCalendarDate = new Date();
        renderCalendarView();
    }

    function renderCalendarView() {
        const grid = document.getElementById('calendar-grid');
        if (!grid) return;
        
        const year = currentCalendarDate.getFullYear();
        const month = currentCalendarDate.getMonth();
        
        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        document.getElementById('calendar-month-year').innerText = `${monthNames[month]} ${year}`;
        
        grid.innerHTML = '';
        
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        
        // Group tasks by date (using created_at for demonstration)
        const tasksByDate = {};
        tasks.forEach(task => {
            const date = new Date(task.created_at);
            if (date.getFullYear() === year && date.getMonth() === month) {
                const day = date.getDate();
                if (!tasksByDate[day]) tasksByDate[day] = [];
                tasksByDate[day].push(task);
            }
        });
        
        const today = new Date();
        const isCurrentMonth = today.getFullYear() === year && today.getMonth() === month;
        const currentDay = today.getDate();
        
        // Create 35 or 42 cells depending on the month layout
        const totalCells = (firstDay + daysInMonth) > 35 ? 42 : 35;
        // Adjust grid rows based on total cells
        grid.className = `flex-1 grid grid-cols-7 grid-rows-${totalCells/7} gap-[1px]`;
        
        for (let i = 0; i < totalCells; i++) {
            const cell = document.createElement('div');
            cell.className = 'bg-white p-1 flex flex-col min-h-[100px] overflow-hidden hover:bg-surfaceHover transition-colors cursor-pointer group relative';
            
            const dayNum = i - firstDay + 1;
            
            if (i >= firstDay && dayNum <= daysInMonth) {
                // Active month cell
                const isToday = isCurrentMonth && dayNum === currentDay;
                const header = document.createElement('div');
                header.className = 'flex justify-end mb-1';
                header.innerHTML = `<span class="text-xs font-medium w-6 h-6 flex items-center justify-center rounded-full ${isToday ? 'bg-primary text-white shadow-sm' : 'text-textMain'}">${dayNum}</span>`;
                cell.appendChild(header);
                
                // Add task pills
                const dayTasks = tasksByDate[dayNum] || [];
                dayTasks.slice(0, 3).forEach(task => { // Show up to 3 tasks
                    const statusDef = STATUSES[task.status] || {color: 'bg-gray-100 text-gray-700'};
                    const taskEl = document.createElement('div');
                    taskEl.className = `text-[10px] font-bold truncate px-1.5 py-0.5 rounded mb-1 shadow-sm border border-black/5 ${statusDef.color} hover:opacity-80 transition-opacity`;
                    taskEl.innerText = task.title;
                    taskEl.onclick = (e) => { e.stopPropagation(); openTaskPanel(task.id); };
                    cell.appendChild(taskEl);
                });
                
                if (dayTasks.length > 3) {
                    const moreEl = document.createElement('div');
                    moreEl.className = 'text-[10px] text-textMuted font-bold text-center mt-auto pb-1';
                    moreEl.innerText = `+${dayTasks.length - 3} more`;
                    cell.appendChild(moreEl);
                }
                
                // Quick add button on hover
                const quickAdd = document.createElement('button');
                quickAdd.className = 'absolute bottom-1 right-1 opacity-0 group-hover:opacity-100 text-textMuted hover:text-primary transition-all p-1 bg-white/80 backdrop-blur rounded';
                quickAdd.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>`;
                quickAdd.onclick = (e) => { e.stopPropagation(); openCreateTaskModal(projectId); };
                cell.appendChild(quickAdd);
                
            } else {
                // Empty cell (previous/next month styling)
                cell.className += ' bg-surface/30';
            }
            
            grid.appendChild(cell);
        }
    }

    function switchView(view) {
        ['list', 'board', 'table', 'calendar'].forEach(v => {
            const viewEl = document.getElementById(`view-${v}`);
            const tabEl = document.getElementById(`tab-${v}`);
            if (viewEl && tabEl) {
                if (v === view) {
                    viewEl.classList.remove('hidden');
                    tabEl.classList.replace('border-transparent', 'border-primary');
                    tabEl.classList.replace('text-textMuted', 'text-primary');
                } else {
                    viewEl.classList.add('hidden');
                    tabEl.classList.replace('border-primary', 'border-transparent');
                    tabEl.classList.replace('text-primary', 'text-textMuted');
                }
            }
        });
    }

    // Modal Events Setup
    document.addEventListener('taskPanelOpened', async (e) => {
        const taskId = e.detail.taskId;
        const panel = document.getElementById('slide-over-panel');
        const template = document.getElementById('task-detail-template').content.cloneNode(true);
        panel.innerHTML = '';
        panel.appendChild(template);
        
        // Fetch task details
        try {
            const res = await fetchWithAuth(`/tasks/${taskId}/`);
            if (res.ok) {
                const task = await res.json();
                
                document.getElementById('modal-title').innerText = task.title;
                document.getElementById('modal-description-input').value = task.description || '';
                document.getElementById('modal-start-date').value = formatDateForInput(task.start_date);
                document.getElementById('modal-due-date').value = formatDateForInput(task.due_date);
                document.getElementById('modal-time-estimate').value = task.time_estimate_minutes || '';
                document.getElementById('modal-tags-input').value = task.tags || '';

                populateAssigneeSelect(task.assignee);

                const assigneeButton = document.getElementById('btn-assign-task');
                const assigneeSelect = document.getElementById('modal-assignee-select');
                assigneeButton.onclick = async () => {
                    const newAssignee = assigneeSelect.value || null;
                    const ok = await patchTask(taskId, { assignee: newAssignee }, newAssignee ? 'Assignee updated' : 'Task unassigned');
                    if (ok) document.getElementById('modal-assignee').innerText = getMemberLabel(newAssignee);
                 };

                 document.getElementById('btn-save-task-details').onclick = async () => {
                     const btn = document.getElementById('btn-save-task-details');
                     const originalText = btn.innerText;
                     btn.disabled = true;
                     btn.innerText = 'Saving...';

                     const timeEstimate = document.getElementById('modal-time-estimate').value;
                     const payload = {
                         description: document.getElementById('modal-description-input').value || '',
                         start_date: document.getElementById('modal-start-date').value ? `${document.getElementById('modal-start-date').value}T00:00:00Z` : null,
                         due_date: document.getElementById('modal-due-date').value ? `${document.getElementById('modal-due-date').value}T00:00:00Z` : null,
                         time_estimate_minutes: timeEstimate ? parseInt(timeEstimate, 10) : null,
                         tags: document.getElementById('modal-tags-input').value || ''
                     };

                     console.log('Saving task with payload:', payload);
                     const success = await patchTask(taskId, payload, 'Task details updated');

                     btn.disabled = false;
                     btn.innerText = originalText;
                 };

                const statusSelect = document.getElementById('modal-status-select');
                statusSelect.value = task.status;
                statusSelect.className = `text-xs font-bold uppercase tracking-wide px-2 py-1.5 rounded cursor-pointer outline-none appearance-none border transition-colors ${STATUSES[task.status] ? STATUSES[task.status].color + ' ' + STATUSES[task.status].border : 'bg-surfaceHover border-borderSubtle'}`;
                
                statusSelect.onchange = async (e) => {
                    const newStatus = e.target.value;
                    try {
                        const r = await fetchWithAuth(`/tasks/update_status/${taskId}/`, {
                            method: 'PATCH',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ status: newStatus })
                        });
                        if(r.ok) {
                            showToast(`Status updated to ${STATUSES[newStatus].label}`);
                            fetchTasks(); // update background
                            // Update select color
                            statusSelect.className = `text-xs font-bold uppercase tracking-wide px-2 py-1.5 rounded cursor-pointer outline-none appearance-none border transition-colors ${STATUSES[newStatus].color} ${STATUSES[newStatus].border}`;
                        } else showToast('Failed to update status', 'error');
                    } catch(err) { showToast('Network error', 'error'); }
                };
                
                const prioritySelect = document.getElementById('modal-priority-select');
                prioritySelect.value = task.priority;
                const setPrioClass = (val) => {
                    const p = PRIORITIES[val];
                    prioritySelect.className = `text-xs font-bold uppercase tracking-wide px-2 py-1.5 rounded cursor-pointer outline-none appearance-none border transition-colors ${p ? p.badge : 'bg-surfaceHover border-borderSubtle'}`;
                };
                setPrioClass(task.priority);
                
                prioritySelect.onchange = async (e) => {
                    const newPrio = e.target.value;
                    try {
                        const r = await fetchWithAuth(`/tasks/${taskId}/`, {
                            method: 'PATCH',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ priority: newPrio })
                        });
                        if(r.ok) {
                            showToast('Priority updated');
                            fetchTasks(); // update background
                            setPrioClass(newPrio);
                        } else showToast('Failed to update priority', 'error');
                    } catch(err) { showToast('Network error', 'error'); }
                };

                // Load Comments
                loadComments(taskId);
                
                // Bind Comment Button
                document.getElementById('btn-post-comment').onclick = () => postComment(taskId);
            }
        } catch(e) {
            console.error(e);
        }
    });

    async function loadComments(taskId) {
        try {
            const res = await fetchWithAuth(`/tasks/${taskId}/comments/`);
            if (res.ok) {
                const data = await res.json();
                const container = document.getElementById('modal-comments');
                container.innerHTML = '';
                
                if (data.results && data.results.length > 0) {
                    data.results.forEach(comment => {
                        container.innerHTML += `
                            <div class="flex gap-3 bg-surface p-3 rounded-lg border border-borderSubtle">
                                <div class="w-8 h-8 rounded-full bg-primary text-white flex items-center justify-center text-xs font-bold shrink-0">U</div>
                                <div>
                                    <div class="flex items-center gap-2 mb-1">
                                        <span class="text-sm font-bold text-textMain">${comment.user_name || 'User'}</span>
                                        <span class="text-xs text-textMuted">${new Date(comment.created_at).toLocaleString()}</span>
                                    </div>
                                    <p class="text-sm text-textMain whitespace-pre-wrap">${comment.comment}</p>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    container.innerHTML = `<p class="text-sm text-textMuted italic p-4 text-center">No comments yet. Start the conversation!</p>`;
                }
            }
        } catch(e) {}
    }

    async function postComment(taskId) {
        const input = document.getElementById('comment-input');
        const text = input.value.trim();
        if(!text) return;
        
        try {
            const res = await fetchWithAuth(`/tasks/${taskId}/comments/`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ comment: text })
            });
            
            if (res.ok) {
                input.value = '';
                loadComments(taskId);
                showToast('Comment posted!');
            } else {
                const data = await res.json().catch(() => ({}));
                showToast(getFirstErrorMessage(data, 'Failed to post comment'), 'error');
            }
        } catch(e) {
            showToast('Network error', 'error');
        }
    }

      // Refresh tasks if created from global modal
      window.addEventListener('taskCreated', fetchTasks);

      window.addEventListener('DOMContentLoaded', () => {
          fetchProjectData();
      });
  </script>
