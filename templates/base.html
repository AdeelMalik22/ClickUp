<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ClickUp Clone{% endblock %}</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- SortableJS for Drag and Drop -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#7B68EE', // ClickUp purple
                        primaryHover: '#5E48E8',
                        surface: '#FFFFFF',
                        surfaceHover: '#F7F8F9',
                        borderSubtle: '#E9EBEF',
                        textMain: '#292D34',
                        textMuted: '#7C828D',
                        sidebarBg: '#2A2E34',
                        sidebarText: '#B1B5C0',
                        sidebarHover: '#3B4048'
                    },
                    boxShadow: {
                        'premium': '0 4px 20px -2px rgba(0, 0, 0, 0.05), 0 0 3px rgba(0,0,0,0.02)',
                        'floating': '0 10px 30px -5px rgba(0, 0, 0, 0.1)',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #FAFBFC; color: #292D34; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }

        /* Smooth slide-over animations */
        .slide-enter { transform: translateX(100%); }
        .slide-enter-active { transform: translateX(0); transition: transform 300ms ease-out; }
        .slide-exit { transform: translateX(0); }
        .slide-exit-active { transform: translateX(100%); transition: transform 300ms ease-in; }

        /* Toast animations */
        .toast-enter { transform: translateY(100%); opacity: 0; }
        .toast-enter-active { transform: translateY(0); opacity: 1; transition: all 300ms cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
    
    <script>
        // Global Auth & UI Handlers
        const apiBase = ''; 

        function getAuthToken() { return localStorage.getItem('access_token'); }
        function setAuthToken(access, refresh) {
            localStorage.setItem('access_token', access);
            if(refresh) localStorage.setItem('refresh_token', refresh);
        }
        function clearAuth() {
            localStorage.removeItem('access_token');
            localStorage.removeItem('refresh_token');
        }

        async function fetchWithAuth(url, options = {}) {
            const token = getAuthToken();
            if (!options.headers) options.headers = {};
            if (token) options.headers['Authorization'] = `Bearer ${token}`;
            
            const response = await fetch(url, options);
            if (response.status === 401 && token) {
                clearAuth();
                window.location.href = '/';
            }
            return response;
        }

        // Global Toast Notification System
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const colors = {
                success: 'bg-green-500',
                error: 'bg-red-500',
                info: 'bg-blue-500'
            };
            const icon = type === 'success' ? `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>` : 
                         type === 'error' ? `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>` : 
                         `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;

            toast.className = `flex items-center gap-3 text-white px-4 py-3 rounded-lg shadow-floating toast-enter ${colors[type] || colors.info}`;
            toast.innerHTML = `<div>${icon}</div><div class="text-sm font-medium">${message}</div>`;
            
            container.appendChild(toast);
            
            // Trigger animation
            requestAnimationFrame(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('toast-enter-active');
            });

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(100%)';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        window.addEventListener('DOMContentLoaded', () => {
            const publicPages = ['/', '/register/'];
            const path = window.location.pathname;
            
            if (!publicPages.includes(path) && !getAuthToken()) {
                window.location.href = '/';
            } else if (publicPages.includes(path) && getAuthToken()) {
                window.location.href = '/dashboard/';
            }
        });
    </script>
    {% block extra_head %}{% endblock %}
</head>
<body class="flex flex-col h-screen overflow-hidden">
    <!-- Global Toast Container -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2"></div>
    
    {% block body %}
    {% endblock %}
</body>
</html>
