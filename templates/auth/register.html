{% extends 'base.html' %}

{% block title %}Sign Up - ClickUp Clone{% endblock %}

{% block body %}
<div class="flex flex-1 h-screen overflow-hidden bg-surface">
    <!-- Left Side: Form -->
    <div class="w-full md:w-[480px] lg:w-[520px] flex flex-col justify-center px-8 sm:px-16 lg:px-20 border-r border-borderSubtle bg-white relative z-10 shadow-xl overflow-y-auto">
        <div class="py-8">
            <div class="mb-8 flex items-center gap-2">
                <div class="w-8 h-8 bg-primary rounded shadow-sm flex items-center justify-center">
                    <span class="text-white font-bold text-lg">C</span>
                </div>
                <span class="text-xl font-bold text-textMain tracking-tight">ClickUp Clone</span>
            </div>

            <h1 class="text-3xl font-bold text-textMain mb-2">Create an account</h1>
            <p class="text-textMuted text-sm mb-8">Join thousands of teams managing their work.</p>
            
            <form id="register-form" class="space-y-4">
                <div>
                    <label for="name" class="block text-sm font-semibold text-textMain mb-1.5">Full Name</label>
                    <input type="text" id="name" name="name" required 
                        class="w-full px-4 py-2.5 bg-surfaceHover border border-borderSubtle rounded-lg focus:bg-white focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all placeholder-textMuted/50 text-sm"
                        placeholder="e.g. Jane Doe">
                </div>

                <div>
                    <label for="username" class="block text-sm font-semibold text-textMain mb-1.5">Username</label>
                    <input type="text" id="username" name="username" required 
                        class="w-full px-4 py-2.5 bg-surfaceHover border border-borderSubtle rounded-lg focus:bg-white focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all placeholder-textMuted/50 text-sm"
                        placeholder="e.g. janedoe">
                </div>
                
                <div>
                    <label for="email" class="block text-sm font-semibold text-textMain mb-1.5">Work Email</label>
                    <input type="email" id="email" name="email" required 
                        class="w-full px-4 py-2.5 bg-surfaceHover border border-borderSubtle rounded-lg focus:bg-white focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all placeholder-textMuted/50 text-sm"
                        placeholder="jane@company.com">
                </div>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label for="password" class="block text-sm font-semibold text-textMain mb-1.5">Password</label>
                        <input type="password" id="password" name="password" required minlength="8"
                            class="w-full px-4 py-2.5 bg-surfaceHover border border-borderSubtle rounded-lg focus:bg-white focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all placeholder-textMuted/50 text-sm"
                            placeholder="••••••••">
                    </div>
                    <div>
                        <label for="password2" class="block text-sm font-semibold text-textMain mb-1.5">Confirm Password</label>
                        <input type="password" id="password2" name="password2" required minlength="8"
                            class="w-full px-4 py-2.5 bg-surfaceHover border border-borderSubtle rounded-lg focus:bg-white focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all placeholder-textMuted/50 text-sm"
                            placeholder="••••••••">
                    </div>
                </div>

                <button type="submit" id="submit-btn" 
                    class="w-full bg-primary hover:bg-primaryHover text-white font-medium py-2.5 rounded-lg transition-all duration-200 shadow-md shadow-primary/20 hover:shadow-lg hover:shadow-primary/30 active:scale-[0.98] mt-4">
                    Sign Up
                </button>
            </form>
            
            <div class="mt-8 text-center text-sm text-textMuted">
                Already have an account? <a href="/" class="text-primary hover:text-primaryHover font-medium hover:underline transition-colors">Log in</a>
            </div>
        </div>
    </div>

    <!-- Right Side: Graphic/Pattern -->
    <div class="hidden md:flex flex-1 relative bg-gradient-to-br from-[#ECE9FF] to-[#F5F3FF] items-center justify-center overflow-hidden">
        <!-- Abstract Shapes -->
        <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-primary/20 rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-blob"></div>
        <div class="absolute top-1/3 right-1/4 w-96 h-96 bg-pink-300/20 rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-blob animation-delay-2000"></div>
        <div class="absolute -bottom-8 left-1/3 w-96 h-96 bg-purple-300/20 rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-blob animation-delay-4000"></div>
        
        <div class="relative z-10 max-w-lg text-center px-8">
            <div class="bg-white/40 backdrop-blur-md border border-white/60 p-8 rounded-2xl shadow-xl">
                <h2 class="text-2xl font-bold text-gray-900 mb-4">"The best task management tool we've used."</h2>
                <p class="text-gray-600 mb-6">- Happy Customer</p>
                <div class="flex justify-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-primary"></span>
                    <span class="w-2 h-2 rounded-full bg-gray-300"></span>
                    <span class="w-2 h-2 rounded-full bg-gray-300"></span>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    @keyframes blob {
        0% { transform: translate(0px, 0px) scale(1); }
        33% { transform: translate(30px, -50px) scale(1.1); }
        66% { transform: translate(-20px, 20px) scale(0.9); }
        100% { transform: translate(0px, 0px) scale(1); }
    }
    .animate-blob { animation: blob 7s infinite; }
    .animation-delay-2000 { animation-delay: 2s; }
    .animation-delay-4000 { animation-delay: 4s; }
</style>

<script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const name = document.getElementById('name').value;
        const username = document.getElementById('username').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const password2_input = document.getElementById('password2').value;
        const btn = document.getElementById('submit-btn');
        
        if (password !== password2_input) {
            showToast("Passwords do not match.", 'error');
            return;
        }
        
        btn.disabled = true;
        btn.innerHTML = `<svg class="animate-spin h-5 w-5 mx-auto text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>`;
        
        try {
            const res = await fetch('/users/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, username, email, password, password2: password2_input, role: 'user' })
            });
            
            const data = await res.json();
            
            if (res.ok) {
                // Auto login
                const loginRes = await fetch('/api/token/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const loginData = await loginRes.json();
                if (loginRes.ok) {
                    setAuthToken(loginData.access, loginData.refresh);
                    window.location.href = '/onboarding/';
                } else {
                    window.location.href = '/';
                }
            } else {
                let errorMsg = 'Registration failed. ';
                if (typeof data === 'object') {
                    const firstKey = Object.keys(data)[0];
                    errorMsg = data[firstKey];
                }
                showToast(errorMsg, 'error');
            }
        } catch (err) {
            showToast('A network error occurred.', 'error');
        } finally {
            btn.disabled = false;
            btn.innerText = 'Sign Up';
        }
    });
</script>
{% endblock %}
